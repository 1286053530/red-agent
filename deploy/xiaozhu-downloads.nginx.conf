# Managed download site for red-agent; separate from the application backend.
server {
    listen 3300;
    server_name _;
    root /srv/xiaozhu-downloads;
    index index.html;
    autoindex off;
    server_tokens off;
    sendfile on;
    access_log /var/log/nginx/xiaozhu-downloads.access.log;
    error_log /var/log/nginx/xiaozhu-downloads.error.log;
    add_header X-Content-Type-Options nosniff always;

    location = / { try_files /index.html =404; }
    location = /index.html { }
    location = /latest.json { }
    location = /SHA256SUMS.txt { }

    location ~ ^/releases/[0-9]+\.[0-9]+\.[0-9]+/XiaozhuShujin-[A-Za-z0-9.\-]+\.exe$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/releases/[0-9]+\.[0-9]+\.[0-9]+/(SHA256SUMS\.txt|latest\.json|index\.html)$ {
        try_files $uri =404;
    }

    location / { return 404; }
}
